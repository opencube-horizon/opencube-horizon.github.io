apiVersion: v1
kind: Pod
metadata:
  name: openfam-client-pod
spec:
  schedulerName: default-scheduler
  containers:
    - name: launcher
      image: harbor.pt.horizon-opencube.eu/baseimages/openfam-client:latest
      command:
        - /bin/sh
        - -c
        - sleep infinity;
      env:
        - name: FI_PROVIDER
          value: cxi
        - name: CXIP_SKIP_AMA_CHECK
          value: "true"
        - name: FI_CXI_LLRING_MODE
          value: never
        - name: OPENFAM_INSTALL_DIR
          value: "/usr/local/"
        - name: OPENFAM_ROOT
          value: "/usr/local/"
      volumeMounts:
        - name: cis
          mountPath: "/usr/local/config/fam_client_interface_config.yaml"
          subPath: "fam_client_interface_config.yaml"
        - name: meta
          mountPath: "/usr/local/config/fam_metadata_config.yaml"
          subPath: "fam_metadata_config.yaml"
        - name: mem
          mountPath: "/usr/local/config/fam_memoryserver_config.yaml"
          subPath: "fam_memoryserver_config.yaml"
        - name: pe
          mountPath: "/usr/local/config/fam_pe_config.yaml"
          subPath: "fam_pe_config.yaml"
      resources:
        requests:
          smarter-devices/cxi0: "1"
        limits:
          smarter-devices/cxi0: "1"
  volumes:
    - name: cis
      configMap:
        name: openfam-cis
    - name: meta
      configMap:
        name: openfam-meta
    - name: mem
      configMap:
        name: openfam-mem
    - name: pe
      configMap:
        name: openfam-pe
  restartPolicy: OnFailure